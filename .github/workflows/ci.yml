name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The platform suite runs with no puzzle family installed, on two architectures,
  # because the deterministic core must agree across them. See ADR 0003.
  platform:
    name: platform suite (no family installed) — ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Platform suite with zero families registered
        run: cargo test -p gs-core --test platform_with_no_family -- --nocapture
      - name: Anti-vacuity guard
        run: cargo test -p gs-core --test anti_vacuity_guard -- --nocapture
      # The pinned state hash is the reason this job is a matrix: the deterministic
      # core has to agree across architectures, and a platform-dependent encoding
      # shows up here or not at all.
      - name: Determinism and replay
        run: cargo test -p gs-core --test determinism -- --nocapture

  checks:
    name: fmt, clippy, full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace --all-targets

  # The one job that checks our solver text against a real solver. Everything else
  # in this repository compares our work to our own work, so without this job the
  # `encoding` tests could pass over text no solver would accept.
  #
  # GATEDSPARK_REQUIRE_SOLVER=1 is the point of the job: under it, a missing solver
  # fails the test instead of skipping it. A test that skips when its dependency is
  # absent reports green while checking nothing, which is the failure this repository
  # is built to prevent.
  solver:
    name: solver agrees with us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Show solver version
        run: z3 --version
      - name: Solver agreement
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
        run: cargo test -p gs-nonogram --test solver_agreement -- --nocapture

  # Windows is built with the GNU toolchain, which ships its own linker, so the
  # repository builds on a stock Windows machine that has only rustup installed.
  # The pinned "msvc" default borrows link.exe from Visual Studio or the Microsoft
  # Build Tools, and fails outright when neither is present. Decided 2026-10-22;
  # see docs/adr/0005-windows-gnu-toolchain.md.
  #
  # What this job proves: the wrapper picks a toolchain whose host triple is
  # `*-windows-gnu`, and the whole workspace compiles and its tests pass under it.
  # What it does not prove: that the build would work on a machine with no Visual
  # Studio at all. GitHub's Windows runners come with the Build Tools installed and
  # there is no honest way to uninstall them inside a job, so that part rests on the
  # target triple rather than on a test. ADR 0003 records it that way.
  windows:
    name: windows builds with its own linker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the GNU toolchain the wrapper asks for
        shell: cmd
        run: scripts\windows\cargo.cmd --version
      - name: The chosen toolchain is the GNU one
        shell: cmd
        run: |
          scripts\windows\cargo.cmd --version --verbose
          scripts\windows\cargo.cmd --version --verbose | findstr /c:"host: x86_64-pc-windows-gnu" || exit /b 1
      - name: Build and test the workspace
        shell: cmd
        run: scripts\windows\cargo.cmd test --workspace --all-targets

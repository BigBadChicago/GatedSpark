name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The platform suite runs with no puzzle family installed, on two architectures,
  # because the deterministic core must agree across them. See ADR 0003.
  platform:
    name: platform suite (no family installed) — ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Platform suite with zero families registered
        run: cargo test -p gs-core --test platform_with_no_family -- --nocapture
      - name: Anti-vacuity guard
        run: cargo test -p gs-core --test anti_vacuity_guard -- --nocapture
      # The pinned state hash is the reason this job is a matrix: the deterministic
      # core has to agree across architectures, and a platform-dependent encoding
      # shows up here or not at all.
      - name: Determinism and replay
        run: cargo test -p gs-core --test determinism -- --nocapture

  # Windows developer builds use the gnu toolchain, which brings its own linker; the
  # msvc default borrows one from Visual Studio, so a machine without Visual Studio
  # cannot link at all. See ADR 0005. This job keeps that path from rotting, and
  # selects the toolchain the same way scripts/setup-windows.ps1 does rather than
  # naming a version of its own, so the pin stays the single source of the version.
  #
  # What this job does NOT prove: that the build works with no Visual Studio present.
  # GitHub's Windows runners ship it and we do not remove it to find out. The narrower
  # claim it defends is that the gnu toolchain builds this workspace and passes its
  # tests. Solver agreement stays gated by the Linux job below.
  windows:
    name: windows builds on the gnu toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch the default host to gnu
        run: rustup set default-host x86_64-pc-windows-gnu
      # Reads rust-toolchain.toml, so this also installs the pinned toolchain for the
      # gnu host. The triple it prints is the assertion worth reading in the log.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          rustc -vV
      # Asserted rather than printed. The whole point of the job is which host is in
      # use, and a triple a human has to read in a log is not a check: the job would
      # stay green if the switch above silently stopped working.
      - name: The host really is the gnu one
        shell: cmd
        run: |
          rustc -vV | findstr /c:"host: x86_64-pc-windows-gnu" || exit /b 1
      - name: Full test suite
        run: cargo test --workspace --all-targets

  checks:
    name: fmt, clippy, full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace --all-targets

  # The one job that checks our solver text against a real solver. Everything else
  # in this repository compares our work to our own work, so without this job the
  # `encoding` tests could pass over text no solver would accept.
  #
  # GATEDSPARK_REQUIRE_SOLVER=1 is the point of the job: under it, a missing solver
  # fails the test instead of skipping it. A test that skips when its dependency is
  # absent reports green while checking nothing, which is the failure this repository
  # is built to prevent.
  solver:
    name: solver agrees with us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Show solver version
        run: z3 --version
      - name: Solver agreement
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
        run: cargo test -p gs-nonogram --test solver_agreement -- --nocapture


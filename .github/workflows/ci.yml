name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The platform suite runs with no puzzle family installed, on two architectures,
  # because the deterministic core must agree across them. See ADR 0003.
  platform:
    name: platform suite (no family installed) — ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Platform suite with zero families registered
        run: cargo test -p gs-core --test platform_with_no_family -- --nocapture
      - name: Anti-vacuity guard
        run: cargo test -p gs-core --test anti_vacuity_guard -- --nocapture
      # The pinned state hash is the reason this job is a matrix: the deterministic
      # core has to agree across architectures, and a platform-dependent encoding
      # shows up here or not at all.
      - name: Determinism and replay
        run: cargo test -p gs-core --test determinism -- --nocapture

  # Windows developer builds use the gnu toolchain, which brings its own linker; the
  # msvc default borrows one from Visual Studio, so a machine without Visual Studio
  # cannot link at all. See ADR 0005. This job keeps that path from rotting, and
  # selects the toolchain the same way scripts/setup-windows.ps1 does rather than
  # naming a version of its own, so the pin stays the single source of the version.
  #
  # What this job does NOT prove: that the build works with no Visual Studio present.
  # GitHub's Windows runners ship it and we do not remove it to find out. The narrower
  # claim it defends is that the gnu toolchain builds this workspace and passes its
  # tests. Solver agreement stays gated by the Linux job below.
  windows:
    name: windows builds on the gnu toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch the default host to gnu
        run: rustup set default-host x86_64-pc-windows-gnu
      # Reads rust-toolchain.toml, so this also installs the pinned toolchain for the
      # gnu host. The triple it prints is the assertion worth reading in the log.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          rustc -vV
      # Asserted rather than printed. The whole point of the job is which host is in
      # use, and a triple a human has to read in a log is not a check: the job would
      # stay green if the switch above silently stopped working.
      - name: The host really is the gnu one
        shell: cmd
        run: |
          rustc -vV | findstr /c:"host: x86_64-pc-windows-gnu" || exit /b 1
      - name: Full test suite
        run: cargo test --workspace --all-targets

  checks:
    name: fmt, clippy, full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace --all-targets
      # --all-targets skips doc tests, and one of them is a real check rather than
      # an example: package::Opened documents that the type cannot be built outside
      # its module, as a compile_fail block. Without this step that claim would be
      # unenforced, which is the one thing this repository does not allow.
      - run: cargo test --workspace --doc

  # The browser build, compiled rather than run. `gs-web` is the only crate whose
  # target is not the machine building it, so nothing else in CI would notice a
  # change that breaks it — and the failure it guards against is not a build error
  # at all. `gs-solver` and `gs-store` compile for this target perfectly happily
  # and then do nothing at run time, which would make a browser that answers
  # "don't know" to every question and so never finds a puzzle unique. The test
  # that keeps them out runs in the suite above; this job is what makes sure the
  # crate they are kept out of still builds for the place it is meant to run.
  #
  # What this job does NOT prove: that the translation layer works in a real
  # browser. That needs a headless browser and is recorded as not enforced in
  # ADR 0009 rather than implied here.
  browser:
    name: the core builds for a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the browser target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the browser crate
        run: cargo build -p gs-web --target wasm32-unknown-unknown --release
      # Printed rather than asserted, on purpose: there is no size limit to enforce
      # yet, and inventing one would be a number nobody chose. The log is where the
      # next person looks when deciding whether there should be a limit.
      - name: Report the download size
        run: |
          raw=$(stat -c%s target/wasm32-unknown-unknown/release/gs_web.wasm)
          gz=$(gzip -c target/wasm32-unknown-unknown/release/gs_web.wasm | wc -c)
          echo "browser module: $((raw / 1024)) KB, $((gz / 1024)) KB compressed"
      # And the part compiling cannot prove: that it works in a browser. This runs the
      # crate's `in_a_real_browser` tests inside headless Chrome, which is the only way
      # to check that `wasm_bindgen` really carries a byte array in and a string out, and
      # that real SHA-256 and real Ed25519 give the same answers in a browser's
      # WebAssembly engine as they do natively.
      #
      # The runner's version must match the `wasm-bindgen` dependency, and ChromeDriver's
      # must match Chrome's. Both are printed before the tests run, because a mismatch in
      # either reads as a broken test rather than a setup problem.
      - name: Install the browser test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Show the browser and driver versions
        run: |
          wasm-bindgen --version
          chromedriver --version
          google-chrome --version
      - name: The browser crate works in a real browser
        env:
          CHROMEDRIVER: /usr/bin/chromedriver
        run: cargo test -p gs-web --target wasm32-unknown-unknown --test in_a_real_browser

  # The one job that checks our solver text against a real solver. Everything else
  # in this repository compares our work to our own work, so without this job the
  # `encoding` tests could pass over text no solver would accept.
  #
  # GATEDSPARK_REQUIRE_SOLVER=1 is the point of the job: under it, a missing solver
  # fails the test instead of skipping it. A test that skips when its dependency is
  # absent reports green while checking nothing, which is the failure this repository
  # is built to prevent.
  solver:
    name: solver agrees with us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two solvers, not one. ADR 0002 asked for a second, independent solver
      # cross-checking every verdict, and the tests have supported it through
      # GATEDSPARK_SMT_SOLVER_2 since M2 while nothing in CI set it — so the
      # cross-check existed and had never run. Both are in Ubuntu's own packages, so
      # this costs one apt line and no vendoring.
      - name: Install Z3 and CVC5
        run: sudo apt-get update && sudo apt-get install -y z3 cvc5
      - name: Show solver versions
        run: z3 --version && cvc5 --version | head -1
      # The runner itself, before the encoding that goes through it. This is the only
      # test that shows a real solver really does print error output containing the
      # text `sat` on stdout, which is what `gs-solver`'s whole-line parsing exists to
      # survive. A fake solver cannot establish that; only a real one can.
      - name: The solver runner handles a real solver
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
        run: cargo test -p gs-solver --test real_solver -- --nocapture
      # And the encoding through it. Since the test now drives `gs_solver` rather than
      # a copy of the same logic, this job checks the code that actually ships.
      # Both families, each against both solvers. A disagreement between the two
      # solvers about a uniqueness result fails the build, which is the whole point of
      # having a second one: that claim is the only thing this platform asserts, and a
      # wrong `unsat` from a single solver would look exactly like a right one.
      - name: Solver agreement, Nonogram
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
          GATEDSPARK_SMT_SOLVER_2: cvc5
        run: cargo test -p gs-nonogram --test solver_agreement -- --nocapture
      # Slitherlink's version of the same job, and the only place the one-piece half of
      # the loop rule is checked against a program nobody here wrote. Its headline case
      # is a board of two separate rings, which satisfies every local rule and must
      # come back `unsat`.
      - name: Solver agreement, Slitherlink
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
          GATEDSPARK_SMT_SOLVER_2: cvc5
        run: cargo test -p gs-slitherlink --test solver_agreement -- --nocapture
      # Kakuro's version of the same job. Its headline pair is a board that repeats a
      # digit, which satisfies every total exactly and must come back `unsat`, and the
      # same board with the no-repeats rule cut off our own query text, which must come
      # back `sat`. This is also the job that earned the second solver its keep: CVC5
      # refused every query for a board with a one-square run, because the encoder was
      # writing a unary `+` that is not standard SMT-LIB2 and that Z3 accepts anyway.
      - name: Solver agreement, Kakuro
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
          GATEDSPARK_SMT_SOLVER_2: cvc5
        run: cargo test -p gs-kakuro --test solver_agreement -- --nocapture
      # M5's exit test, run for real: an empty folder becomes a signed, Z3-verified,
      # replayable puzzle, `show` reads its report back out of the signed bytes, and
      # `recheck` fails on a single flipped byte of the stored answer. Every other test
      # in this repository checks a part; this is the one that checks that the parts are
      # connected, and it is the only place the whole pipeline runs against a real
      # solver. Under GATEDSPARK_REQUIRE_SOLVER=1 it cannot quietly skip.
      - name: The whole loop, with a real solver
        env:
          GATEDSPARK_REQUIRE_SOLVER: "1"
        run: cargo test -p gs-cli --test command -- --nocapture


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GatedSpark</title>
<!-- Drawn here rather than fetched. A browser asks every site for /favicon.ico whether
     or not the page mentions one, and a page that mentions none collects a 404 on every
     visit: harmless, but it is noise in exactly the place real faults show up. Inline
     also means it works with no signal, like everything else here. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6f5c'/%3E%3Cg fill='%23fbfbf9'%3E%3Crect x='3' y='3' width='4' height='4'/%3E%3Crect x='9' y='9' width='4' height='4'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* The look, settled with the project owner on 2026-10-25 and built on 2026-10-26.
     Five things decide it, and every rule below serves one of them:

     1. One menu holds the rules, the saving and the checks. The main screen is the
        board and nothing else.
     2. The three actions are pictures with a small word under each.
     3. The three games sit on a bar fixed at the bottom, in reach of a thumb.
     4. No card and no box behind the board. The grid sits on the page itself.
     5. The accent colour appears twice and nowhere else: the game you are on, and the
        square you are on. Not on a filled button, and not round a line of text. */
  :root {
    --paper: #faf8f3;
    --ink: #1d1c19;
    --muted: #77736a;
    --line: #d6d2c6;
    --line-strong: #989385;
    --filled: #1d1c19;
    --empty-mark: #b0ab9f;
    --accent: #1f6f5c;
    --on-accent: #faf8f3;
    --warn: #8c2f1f;
    --warn-wash: #f2e3df;
    --cell-bg: transparent;
    --kakuro-black: #e2ddd0;
    --kakuro-head: #efebe0;
    --sheet: #ffffff;
    --veil: rgba(20, 18, 14, .45);
    /* The squares shrink so a board fits a phone without sliding sideways. A board a
       finger cannot reach the edge of is not a board on a phone. */
    --tap: clamp(1.5rem, 7.2vw, 2.2rem);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121318;
      --ink: #e9eaee;
      --muted: #8d919c;
      --line: #2e3139;
      --line-strong: #585d6a;
      --filled: #e9eaee;
      --empty-mark: #6b707d;
      --accent: #3fc4a4;
      --on-accent: #08201b;
      --warn: #ef8a76;
      --warn-wash: #3a211c;
      /* The white squares are lifted rather than the black ones pushed further down.
         Darkening the blacks on a dark page leaves two shades nobody can tell apart,
         which is how the Kakuro board came out unreadable twice before this. */
      --cell-bg: #1d212a;
      --kakuro-black: #08090d;
      --kakuro-head: #272c37;
      --sheet: #1b1e26;
      --veil: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #121318; --ink: #e9eaee; --muted: #8d919c; --line: #2e3139;
    --line-strong: #585d6a; --filled: #e9eaee; --empty-mark: #6b707d;
    --accent: #3fc4a4; --on-accent: #08201b; --warn: #ef8a76; --warn-wash: #3a211c;
    --cell-bg: #1d212a; --kakuro-black: #08090d; --kakuro-head: #272c37;
    --sheet: #1b1e26; --veil: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 1rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Room at the bottom for the bar of games, so it never covers the board. */
    padding: 0 0 calc(5.5rem + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 0 14px; }

  /* ---- the one line at the top ---------------------------------------- */
  .top { display: flex; align-items: center; gap: .6rem; height: 3.2rem; }
  h1 { font-size: .95rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .top .day { margin-left: auto; color: var(--muted); font-size: .85rem; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.75rem; height: 2.75rem; flex: none;
    background: none; border: 0; border-radius: .5rem; cursor: pointer; color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg {
    width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .menu-btn { margin-right: -.5rem; }

  /* ---- which puzzle this is ------------------------------------------- */
  .head { margin: .3rem 0 1rem; }
  .head h2 { font-size: 1.05rem; margin: 0; }
  .head p { margin: .1rem 0 0; color: var(--muted); font-size: .82rem; }

  /* ---- the board, sitting on the page itself -------------------------- */
  .board-scroll { display: flex; justify-content: center; overflow-x: auto; }

  table.board { border-collapse: collapse; margin: 0 auto; }
  table.board th, table.board td { padding: 0; }

  /* Clue numbers. Columns read downwards, rows read across. */
  th.col-clue {
    vertical-align: bottom;
    font-size: .68rem;
    font-weight: 700;
    color: var(--muted);
    line-height: 1.15;
    padding-bottom: .25rem;
    min-width: var(--tap);
  }
  th.col-clue span { display: block; }
  th.row-clue {
    text-align: right;
    font-size: .72rem;
    font-weight: 700;
    color: var(--muted);
    padding-right: .4rem;
    white-space: nowrap;
    height: var(--tap);
  }
  th.corner { width: 1px; }

  td.square {
    width: var(--tap);
    height: var(--tap);
    border: 1px solid var(--line);
    background: var(--cell-bg);
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Every fifth line heavier, which is how people actually count a grid. */
  td.square.block-left { border-left-color: var(--line-strong); border-left-width: 2px; }
  td.square.block-top { border-top-color: var(--line-strong); border-top-width: 2px; }
  td.square.edge-right { border-right-color: var(--line-strong); border-right-width: 2px; }
  td.square.edge-bottom { border-bottom-color: var(--line-strong); border-bottom-width: 2px; }

  td.square[data-mark="0"] { background: var(--filled); }
  td.square[data-mark="1"]::before,
  td.square[data-mark="1"]::after {
    content: "";
    position: absolute;
    left: 28%; right: 28%; top: 50%;
    border-top: 2px solid var(--empty-mark);
  }
  td.square[data-mark="1"]::before { transform: rotate(45deg); }
  td.square[data-mark="1"]::after { transform: rotate(-45deg); }
  /* The square you are on. This is the second and last place the accent is used. */
  td.square:focus-visible, td.kcell.white:focus-visible {
    outline: 3px solid var(--accent); outline-offset: -3px;
  }
  /* The square a hint is pointing at. A ring inside the square rather than a fill,
     because a fill is what "filled in" means here and the player has not filled it. */
  td.square[data-hint="yes"] { outline: 3px dashed var(--accent); outline-offset: -3px; }
  /* Where a check found something wrong. Warn, never the accent: the accent means
     "you are here", and a square cannot mean two things. */
  td.square[data-wrong="yes"] { background-color: var(--warn-wash); }
  td.square[data-wrong="yes"][data-mark="0"] { background-color: var(--filled); box-shadow: inset 0 0 0 2px var(--warn); }

  /* ---- the Kakuro board ----------------------------------------------
     Its own table, not the Nonogram one with different classes on it. The grid
     carries black squares that are part of the puzzle rather than a state a player
     reached, and a white square shows a digit the player chose, so it holds text
     rather than a fill. */
  table.kboard { border-collapse: collapse; margin: 0 auto; }
  table.kboard th, table.kboard td { padding: 0; }
  table.kboard th.rim {
    font-size: .72rem;
    font-weight: 700;
    color: var(--muted);
    min-width: var(--tap);
    height: var(--tap);
    white-space: nowrap;
  }
  table.kboard th.rim-left { text-align: right; padding-right: .35rem; }
  table.kboard th.rim-top { vertical-align: bottom; padding-bottom: .2rem; }

  td.kcell {
    width: var(--tap);
    height: var(--tap);
    border: 1px solid var(--line-strong);
    background: var(--cell-bg);
    position: relative;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* A black square that carries at least one total. The diagonal separates the two
     numbers and is drawn as a background rather than as a border or an extra element,
     so it cannot be mistaken for a grid line. */
  td.kcell.black.heads {
    background-image: linear-gradient(
      to bottom right,
      transparent calc(50% - .5px), var(--line-strong) calc(50% - .5px),
      var(--line-strong) calc(50% + .5px), transparent calc(50% + .5px)
    );
    background-color: var(--kakuro-head);
  }
  /* A black square that carries nothing is drawn solid, with no diagonal. In a printed
     Kakuro a diagonal means "two runs start here", so drawing one on a square with no
     numbers on it says a run starts there whose total is missing. */
  td.kcell.black.blank { background-color: var(--kakuro-black); }
  td.kcell .across-total,
  td.kcell .down-total {
    position: absolute;
    font-size: .62rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }
  td.kcell .across-total { top: .12rem; right: .16rem; }
  td.kcell .down-total { bottom: .12rem; left: .16rem; }

  td.kcell.white {
    cursor: text;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
  }
  td.kcell.white[data-hint="yes"] { outline: 3px dashed var(--accent); outline-offset: -3px; }
  /* A run with a digit in it twice. Marked on the squares of that run, because
     "somewhere on the board there is a repeat" is not help. The core decides which
     runs these are; the page only draws them. */
  td.kcell.white.repeat,
  td.kcell.white[data-wrong="yes"] { background: var(--warn-wash); }

  /* ---- the loop game ------------------------------------------------ */
  /* Drawn as one picture rather than a table of squares, because what a player marks
     here is the lines between the dots, and a table has no place to put those. */
  #loop { width: 100%; max-width: 26rem; height: auto; touch-action: manipulation; }
  #loop .dot { fill: var(--line-strong); }
  #loop .number { fill: var(--ink); font-size: 13px; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  #loop .number[data-met="yes"] { fill: var(--muted); }
  /* The wide invisible strip over each line, so a finger has something to hit. */
  #loop .grab { stroke: transparent; stroke-width: 16; cursor: pointer; }
  #loop .line { stroke: var(--line); stroke-width: 1; stroke-linecap: round; pointer-events: none; }
  #loop .edge[data-drawn="0"] .line { stroke: var(--ink); stroke-width: 5; }
  #loop .edge[data-drawn="1"] .line { stroke: transparent; }
  /* A line ruled out is shown as a small cross where it would have been, not as a faint
     line: a faint line and a drawn line are the two things a player must never mix up. */
  #loop .ruled { stroke: var(--warn); stroke-width: 2.5; stroke-linecap: round; display: none; pointer-events: none; }
  #loop .edge[data-drawn="1"] .ruled { display: inline; }
  /* The keyboard's place on a line board, drawn along the line itself.
     Not an outline: an outline is drawn round the whole group, and the group contains
     the wide invisible strip a finger aims at, so an outline comes out as a box two
     squares across sitting on top of the numbers. Painting the strip instead puts the
     mark exactly where the line is. */
  #loop .edge:focus-visible { outline: none; }
  #loop .edge:focus-visible .grab { stroke: var(--accent); stroke-opacity: .3; }
  #loop .pointer { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 3 2.5; display: none; pointer-events: none; }
  #loop .edge[data-hint="yes"] .pointer { display: inline; }
  #loop .edge[data-wrong="yes"] .line { stroke: var(--warn); }
  #loop .edge[data-wrong="yes"] .grab { stroke: var(--warn-wash); }

  .status { text-align: center; color: var(--muted); font-size: .82rem; margin: 1rem 0 0; }

  /* ---- the three actions, as pictures --------------------------------- */
  /* Each one carries its name for a screen reader, and shows the same word under the
     picture at a readable size. A lightbulb on its own is a guess for anybody meeting
     the game for the first time, and plain language is the rule for this project. */
  .actions { display: flex; justify-content: center; gap: 1.2rem; margin: 1.1rem 0 0; }
  .act {
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
    background: none; border: 0; cursor: pointer; color: var(--ink);
    padding: .4rem .2rem; min-width: 3.2rem; font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .act svg {
    width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .act span { font-size: .7rem; color: var(--muted); }
  .act:disabled { opacity: .35; cursor: default; }
  .act:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: .4rem; }

  .counts { text-align: center; color: var(--muted); font-size: .75rem; margin: .5rem 0 0; }
  /* Non-breaking spaces: ordinary ones round a dot in generated content
     collapse against the whitespace between the two spans and the dot ends up
     against the next word. */
  .counts span + span::before { content: "\00a0\00b7\00a0"; }

  /* What a hint or a check said. A thin rule beside the words, not a coloured box:
     the accent has two jobs on this page and this is neither of them. */
  .said {
    margin: 1rem 0 0;
    padding-left: .8rem;
    border-left: 2px solid var(--line-strong);
    font-size: .9rem;
  }
  .said.wrong { border-left-color: var(--warn); }
  .note { color: var(--muted); font-size: .8rem; margin: 1rem 0 0; min-height: 1.5em; }

  .solved {
    margin: 1rem 0 0;
    padding-left: .8rem;
    border-left: 2px solid var(--accent);
    font-weight: 700;
  }
  .refused {
    margin: 1rem 0;
    padding: .8rem 1rem;
    border: 2px solid var(--warn);
    border-radius: .5rem;
    color: var(--warn);
  }

  /* ---- the bar of games, at the bottom -------------------------------- */
  .games {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center; gap: .25rem;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: .3rem 10px calc(.3rem + env(safe-area-inset-bottom));
  }
  .game-tab {
    flex: 1 1 0; max-width: 8rem;
    display: flex; flex-direction: column; align-items: center; gap: .1rem;
    background: none; border: 0; cursor: pointer; color: var(--muted);
    padding: .4rem .2rem; font: inherit; font-size: .72rem; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .game-tab svg { width: 1.35rem; height: 1.35rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  /* The game you are on. The first of the accent's two jobs. */
  .game-tab[aria-current="page"] { color: var(--accent); }
  .game-tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -2px; border-radius: .4rem; }

  /* ---- the one menu holding everything else --------------------------- */
  .veil { position: fixed; inset: 0; background: var(--veil); z-index: 8; }
  .sheet {
    position: fixed; z-index: 9; right: 0; top: 0; bottom: 0; width: min(22rem, 92vw);
    background: var(--sheet); border-left: 1px solid var(--line);
    padding: 1rem 1.1rem 2rem; overflow-y: auto;
  }
  .sheet-top { display: flex; align-items: center; margin-bottom: .4rem; }
  .sheet-top h2 { font-size: 1rem; margin: 0; }
  .sheet-top .icon-btn { margin-left: auto; margin-right: -.5rem; }
  .sheet section { padding: 1rem 0; border-top: 1px solid var(--line); }
  .sheet h3 { font-size: .9rem; margin: 0 0 .5rem; }
  .sheet .small { color: var(--muted); font-size: .82rem; margin: 0 0 .6rem; }
  .sheet .stack { display: grid; gap: .4rem; }
  .sheet button.plain,
  .sheet select {
    font: inherit; font-size: .9rem; text-align: left; color: var(--ink);
    background: none; border: 1px solid var(--line-strong); border-radius: .4rem;
    padding: .6rem .7rem; min-height: 2.75rem; cursor: pointer; width: 100%;
  }
  .sheet button.plain:focus-visible,
  .sheet select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .sheet button.plain[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
  .sheet dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .7rem; margin: 0; font-size: .78rem; color: var(--muted); }
  .sheet dt { font-weight: 700; }
  .sheet dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

  /* The rules, inside the menu. A fold so the menu opens on something short. */
  .rules { border: 0; }
  .rules > summary { cursor: pointer; font-size: .9rem; font-weight: 700; }
  .rules > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .rules ul { margin: .6rem 0 0; padding-left: 1.1rem; }
  .rules li { margin: .35rem 0; font-size: .85rem; line-height: 1.5; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>GatedSpark</h1>
    <span class="day" id="day-short"></span>
    <!-- Everything that is not the board lives behind this one button: the rules, what
         is saved on this device, which day to play, and what the page checked before it
         drew anything. The name says what is in there, because "menu" read out on its
         own tells somebody nothing. -->
    <button class="icon-btn menu-btn" id="open-menu" type="button" aria-expanded="false" aria-label="Menu: how to play, saved puzzles, and what this page checked">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <p id="refused" class="refused" role="alert" hidden></p>

  <div id="game" hidden>
    <div class="head">
      <h2 id="game-name"></h2>
      <p id="today-line" role="status" aria-live="polite">Looking for today&rsquo;s puzzle&hellip;</p>
    </div>

    <!-- The lines that speak to the player are live regions. Without that a screen
         reader never reads them: the text changes and nothing announces it, so the
         solved message, the refusal and the running commentary are seen and not heard.
         "polite" waits for a pause; the refusal is an alert because it means the board
         in front of you has gone away. -->
    <p id="solved" class="solved" role="status" aria-live="polite" hidden>Solved. Every clue matches.</p>

    <div class="board-scroll">
      <table class="board" id="board"></table>
      <table class="kboard" id="kboard" hidden></table>
      <svg id="loop" hidden xmlns="http://www.w3.org/2000/svg" role="group"></svg>
    </div>
    <p class="status" id="shape" role="status" aria-live="polite" hidden></p>

    <div class="actions">
      <button class="act" id="hint" type="button" aria-label="Hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.7l.1.5h5l.1-.5c.1-.6.4-1.2 1-1.7A6 6 0 0 0 12 3Z"/></svg>
        <span>Hint</span>
      </button>
      <button class="act" id="check" type="button" aria-label="Check my work">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-4.3-7.7"/><path d="m8.5 11.5 3 3L22 4.5"/></svg>
        <span>Check</span>
      </button>
      <button class="act" id="undo" type="button" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11a5 5 0 0 1 0 10h-5"/><path d="M8 5 4 9l4 4"/></svg>
        <span>Undo</span>
      </button>
      <button class="act" id="redo" type="button" aria-label="Redo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9H9a5 5 0 0 0 0 10h5"/><path d="m16 5 4 4-4 4"/></svg>
        <span>Redo</span>
      </button>
    </div>
    <p class="counts"><span id="hints-left"></span><span id="moves">No moves yet</span></p>

    <!-- `role="status"` so a screen reader reads these out when they arrive. Separate
         from the note below, which the next tap wipes: a hint and a check are both
         worth reading twice. Two lines rather than one, because asking for a hint
         should not wipe the check you just read, or the other way round. -->
    <p id="hint-said" class="said" role="status" aria-live="polite" hidden></p>
    <p id="check-said" class="said" role="status" aria-live="polite" hidden></p>
    <p class="note" id="note" role="status" aria-live="polite"></p>
  </div>
</main>

<!-- The three games, in reach of a thumb. Each one says its own name, so the bar is
     not three pictures somebody has to guess at. -->
<nav class="games" id="game-bar" aria-label="Game"></nav>

<div class="veil" id="veil" hidden></div>
<aside class="sheet" id="menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="sheet-top">
    <h2 id="menu-title">Menu</h2>
    <button class="icon-btn" id="close-menu" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <section>
    <details class="rules" id="rules">
      <summary id="rules-title">How to play</summary>
      <ul id="rules-list"></ul>
    </details>
  </section>

  <section>
    <h3><label for="day-pick">Which day</label></h3>
    <select id="day-pick"></select>
  </section>

  <section>
    <h3>On this device</h3>
    <p class="small" id="saved-line" role="status" aria-live="polite">Checking what is saved on this device…</p>
    <div class="stack">
      <button class="plain" id="save" type="button">Save this one for later</button>
      <button class="plain" id="save-ahead" type="button">Save the next few days</button>
      <button class="plain" id="play-saved" type="button">Play a saved one</button>
      <button class="plain" id="offline" type="button" aria-pressed="false">Pretend there is no signal</button>
      <button class="plain" id="check-withdrawn" type="button">Check for withdrawn puzzles</button>
    </div>
  </section>

  <section>
    <h3>What this page checked</h3>
    <dl>
      <dt>Signed by</dt><dd id="signed-by"></dd>
      <dt>Level</dt><dd id="level"></dd>
      <dt>Puzzle</dt><dd id="fingerprint"></dd>
      <dt>Answers</dt><dd id="encoding"></dd>
    </dl>
  </section>
</aside>


<script type="module">
// The page. It draws a board and sends taps to the core; it answers no question about
// the puzzle itself.
//
// In particular it never works out whether the board is finished. It asks
// `game.is_solved()` every time, which asks the rules, which check the clues. A second
// opinion here would disagree with the first one day, and the wrong one would be the
// one the player saw.

import init, { Page, Square, Side, Drawn } from "./core/gs_web.js";
import { TRUSTED_KEY_ID, TRUSTED_PUBLIC_KEY } from "./trusted-key.js";

const el = (id) => document.getElementById(id);

/** Turn "a1b2" into the bytes it stands for. */
function unhex(text) {
  const out = new Uint8Array(text.length / 2);
  for (let i = 0; i < out.length; i += 1) {
    out[i] = Number.parseInt(text.slice(i * 2, i * 2 + 2), 16);
  }
  return out;
}

/** Tapping moves a square on by one: blank, filled, crossed out, blank. */
const NEXT = {
  [Square.Unknown]: Square.Filled,
  [Square.Filled]: Square.Empty,
  [Square.Empty]: Square.Unknown,
};

/** What each mark is called out loud. The board shows a square's state by how it is
 *  drawn; somebody listening to the page gets nothing from that, so every square and
 *  every line says its state in its own name as well. These are the only words for it,
 *  so a state that gains a look without gaining a word cannot happen quietly. */
const SQUARE_SAID = {
  [Square.Unknown]: "blank",
  [Square.Filled]: "filled",
  [Square.Empty]: "crossed out",
};

const LINE_SAID = {
  [Drawn.Unknown]: "not decided",
  [Drawn.Yes]: "drawn",
  [Drawn.No]: "ruled out",
};

/** A square's whole name: where it is, and what is in it. */
function squareName(row, column, mark) {
  return `row ${row + 1}, column ${column + 1}, ${SQUARE_SAID[mark] ?? "blank"}`;
}

/** A line's whole name. Same shape, same reason. */
function lineName(side, column, row, drawn) {
  const where = side === Side.Across
    ? `line across from dot ${column + 1}, ${row + 1}`
    : `line down from dot ${column + 1}, ${row + 1}`;
  return `${where}, ${LINE_SAID[drawn] ?? "not decided"}`;
}

/** The same for a line: undecided, drawn, ruled out, undecided. */
const NEXT_LINE = {
  [Drawn.Unknown]: Drawn.Yes,
  [Drawn.Yes]: Drawn.No,
  [Drawn.No]: Drawn.Unknown,
};

/** What the core calls a square in a hint's list of places. Lines use `Side.Across`
 *  and `Side.Down`, which are 0 and 1, so a square is the one after them. */
const SQUARE = 2;

/** And a white square of a Kakuro, the one after that.
 *
 *  A separate number from SQUARE although both carry a row and a column, because the
 *  two count different things: a Nonogram's pair indexes the only squares there are,
 *  a Kakuro's indexes the whole grid with its black squares in it. These numbers come
 *  from `gs_web::browser`; there is no second copy of them. */
const DIGIT = 3;

/** What the core sends for a black square where a digit would be, and for a total that
 *  is not there. Both are -1, and neither is 0: a white square with nothing written in
 *  it is 0, and that is the commonest square on the board. */
const BLACK = -1;
const NO_TOTAL = -1;

/** How far apart the dots are drawn, and how much room is left round the edge. */
const STEP = 34;
const MARGIN = 20;

/** What each game tells a player to do. The page's own words, since this is about the
 *  page's controls rather than about the rules. */
const HOW_TO = {
  nonogram:
    "Tap once to fill a square, again to cross it out, again to clear it. Crossing out is just for you: the puzzle is done when the filled squares are right.",
  slitherlink:
    "Tap between two dots to draw a line, again to rule it out, again to clear it. Ruling lines out is just for you: the puzzle is done when the lines make one loop and every number is met.",
  kakuro:
    "Tap a white square and type a digit from 1 to 9. Backspace empties it. Arrow keys move from square to square, so you can play the whole thing without a mouse.",
};

/** The rules of each game, in the player's words rather than the solver's.
 *
 *  These are the page's own text on purpose. The core knows whether a board is
 *  finished; it has nothing to say about what a player is trying to do, and a rule
 *  written twice is a rule that will disagree with itself one day. There is exactly one
 *  copy of each of these sentences, here.
 *
 *  The last line of each list is the controls, which is also what HOW_TO says in the
 *  status line. That repetition is deliberate: the status line is wiped by the next
 *  thing that happens, so it cannot be the only place the controls are written. */
const RULES = {
  nonogram: [
    "Fill in squares to uncover a hidden picture.",
    "The numbers above a column, or beside a row, say how many squares are filled in that line, in order.",
    "So 3 1 means three filled squares together, then at least one blank, then one more filled square.",
    "A line marked 0 has no filled squares in it at all.",
    "You only have to get the filled squares right. Crossing out the blanks is a note to yourself, and nothing checks it.",
    "Tap a square once to fill it, again to cross it out, again to clear it.",
    "Stuck? Hint works part of the puzzle out and fills it in for you, and says which numbers make it certain.",
    "There are three for each puzzle, and they get bigger: one square, then half a row or column, then a whole one.",
  ],
  slitherlink: [
    "Draw one single loop along the lines between the dots.",
    "The loop never crosses itself, never branches, and never splits into two separate loops. When you are done there is exactly one loop and nothing else drawn.",
    "A number in a square says how many of that square's four sides the loop uses. A 3 means three of its sides, a 0 means none of them.",
    "A square with no number in it can have any number of its sides used.",
    "Ruling a line out is a note to yourself, and nothing checks it.",
    "Tap between two dots to draw a line, again to rule it out, again to clear it.",
    "Stuck? Hint works part of the puzzle out and marks it in for you, and says which number or dot makes it certain.",
    "There are three for each puzzle, and they get bigger: one line, then half a row or column of lines, then a whole one.",
  ],
  kakuro: [
    "A crossword done with numbers.",
    "Write a digit from 1 to 9 in every white square.",
    "A run is a straight line of white squares, going across or going down, with nothing black in the middle of it.",
    "Each run has a total. The digits in that run have to add up to it.",
    "No digit may appear twice in the same run. The same digit in two different runs is fine.",
    "The totals are written in the black squares: the one above the diagonal is for the run going right, the one below it is for the run going down. Runs that start at the very edge have their total in the margin.",
    "Tap a white square and type a digit. Backspace empties it. Arrow keys move between squares.",
    "Stuck? Hint works part of the puzzle out and fills it in for you, and says what made it certain.",
    "There are three for each puzzle, and they get bigger: one square, then half a run, then a whole run.",
  ],
};

/** Whether the player has folded the rules away. Kept per device, and only ever a
 *  convenience: if browser storage is unavailable the fold simply opens each time,
 *  which is the safe way round. */
const RULES_CLOSED = "gatedspark.rules-closed";

function showRules(family) {
  const lines = RULES[family];
  const fold = el("rules");
  if (!lines) {
    fold.hidden = true;
    return;
  }
  fold.hidden = false;
  el("rules-title").textContent = `How to play ${NAMES[family] ?? family}`;
  el("rules-list").replaceChildren(
    ...lines.map((line) => {
      const item = document.createElement("li");
      item.textContent = line;
      return item;
    })
  );
  let closed = false;
  try {
    closed = window.localStorage.getItem(RULES_CLOSED) === "yes";
  } catch {
    closed = false;
  }
  fold.open = !closed;
}

/** What each game is called, for the bar at the bottom. One line per game. */
const NAMES = {
  nonogram: "Nonogram",
  slitherlink: "Slitherlink",
  kakuro: "Kakuro",
};

/** A small picture for each game, drawn from its own board: four blocks, a loop, a
 *  grid with a diagonal. Beside the name, never instead of it — three pictures with no
 *  words is three things to guess at. */
const GAME_ICONS = {
  nonogram:
    '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  slitherlink: '<path d="M5 5h9v6h5v8H9v-6H5Z" stroke-linejoin="round"/>',
  kakuro: '<path d="M4 4h16v16H4z"/><path d="M4 4 10 10M10 4h10v6"/><path d="M14 14h2M14 17h4"/>',
};

/** Which game is on screen. The bar at the bottom sets it; nothing else reads a
 *  control to find out. */
let currentFamily = null;

let game = null;
/** The puzzle on screen, so it can be saved or marked played. */
let showing = null;
/** The page's own key list, made once. The saved puzzles are checked against it too. */
let page = null;
/** A switch for trying the offline behaviour without unplugging anything. */
let pretendOffline = false;

/** Open or close the one menu.
 *
 *  Everything that is not the board is in here: the rules, the day, what is saved, and
 *  what the page checked. It is a dialog, so a screen reader announces it as one and a
 *  keyboard lands inside it rather than carrying on down the page behind it. */
function showMenu(open) {
  el("menu").hidden = !open;
  el("veil").hidden = !open;
  el("open-menu").setAttribute("aria-expanded", String(open));
  if (open) {
    el("close-menu").focus();
  } else {
    el("open-menu").focus();
  }
}

function showRefusal(message) {
  el("game").hidden = true;
  el("refused").hidden = false;
  // The core's own words. A page that wrote its own version of "we would not accept
  // this" would eventually say something the core does not mean. The only change made
  // here is the first letter, because these are written as sentences and shown as one.
  el("refused").textContent = message.charAt(0).toUpperCase() + message.slice(1);
}

/** Build the grid once. Taps change squares in place after this. */
function drawBoard() {
  const width = game.width();
  const height = game.height();
  const table = el("board");
  table.replaceChildren();

  // The clue numbers across the top. Each column's numbers read downwards.
  const head = document.createElement("tr");
  head.appendChild(Object.assign(document.createElement("th"), { className: "corner" }));
  for (let column = 0; column < width; column += 1) {
    const th = document.createElement("th");
    th.className = "col-clue";
    th.scope = "col";
    const runs = Array.from(game.column_clue(column));
    th.replaceChildren(
      ...(runs.length ? runs : [0]).map((run) =>
        Object.assign(document.createElement("span"), { textContent: String(run) })
      )
    );
    head.appendChild(th);
  }
  table.appendChild(head);

  for (let row = 0; row < height; row += 1) {
    const tr = document.createElement("tr");
    const runs = Array.from(game.row_clue(row));
    tr.appendChild(
      Object.assign(document.createElement("th"), {
        scope: "row",
        className: "row-clue",
        textContent: (runs.length ? runs : [0]).join(" "),
      })
    );
    for (let column = 0; column < width; column += 1) {
      const td = document.createElement("td");
      td.className = "square";
      if (column % 5 === 0 && column !== 0) td.classList.add("block-left");
      if (row % 5 === 0 && row !== 0) td.classList.add("block-top");
      if (column === width - 1) td.classList.add("edge-right");
      if (row === height - 1) td.classList.add("edge-bottom");
      td.dataset.row = String(row);
      td.dataset.column = String(column);
      td.tabIndex = 0;
      td.setAttribute("role", "button");
      td.setAttribute("aria-label", squareName(row, column, Square.Unknown));
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

/** A Kakuro square's whole name, for somebody who cannot see it.
 *
 *  Said in the same shape as the other two games' names: where it is, then what is in
 *  it. A black square says what totals it carries, because that is its entire content
 *  and a screen reader skipping over it would be skipping the clues. */
function kakuroName(column, row, digit, across, down) {
  const where = `row ${row + 1}, column ${column + 1}`;
  if (digit === BLACK) {
    const totals = [];
    if (across !== NO_TOTAL) totals.push(`${across} across`);
    if (down !== NO_TOTAL) totals.push(`${down} down`);
    return totals.length ? `${where}, totals ${totals.join(", ")}` : `${where}, blocked`;
  }
  return `${where}, ${digit === 0 ? "empty" : digit}`;
}

/** Build the Kakuro grid once. Typing changes digits in place after this.
 *
 *  The shape comes from `game.kakuro_shape()` and the rim totals from
 *  `game.rim_totals()`, so this page never works out which squares are black or which
 *  run a total belongs to. Both are asked for once: the shape of a Kakuro cannot
 *  change while it is being played. */
function drawKakuroBoard() {
  const width = game.width();
  const height = game.height();
  const shape = Array.from(game.kakuro_shape());
  const table = el("kboard");
  table.replaceChildren();

  // The rim totals, read into two lookups so the loops below stay simple. Four numbers
  // each: column, row, across total, down total.
  const rim = Array.from(game.rim_totals());
  const rimAcross = new Map();
  const rimDown = new Map();
  for (let i = 0; i < rim.length; i += 4) {
    const column = rim[i];
    const row = rim[i + 1];
    if (rim[i + 2] !== NO_TOTAL) rimAcross.set(row, rim[i + 2]);
    if (rim[i + 3] !== NO_TOTAL) rimDown.set(column, rim[i + 3]);
  }

  const head = document.createElement("tr");
  head.appendChild(Object.assign(document.createElement("th"), { className: "corner" }));
  for (let column = 0; column < width; column += 1) {
    const th = document.createElement("th");
    th.className = "rim rim-top";
    th.scope = "col";
    const total = rimDown.get(column);
    th.textContent = total === undefined ? "" : String(total);
    if (total !== undefined) th.setAttribute("aria-label", `${total} down, column ${column + 1}`);
    head.appendChild(th);
  }
  table.appendChild(head);

  for (let row = 0; row < height; row += 1) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.className = "rim rim-left";
    th.scope = "row";
    const total = rimAcross.get(row);
    th.textContent = total === undefined ? "" : String(total);
    if (total !== undefined) th.setAttribute("aria-label", `${total} across, row ${row + 1}`);
    tr.appendChild(th);

    for (let column = 0; column < width; column += 1) {
      const at = (row * width + column) * 3;
      const black = shape[at] === 1;
      const across = shape[at + 1];
      const down = shape[at + 2];
      const heads = across !== NO_TOTAL || down !== NO_TOTAL;
      const td = document.createElement("td");
      td.className = black ? `kcell black ${heads ? "heads" : "blank"}` : "kcell white";
      td.dataset.row = String(row);
      td.dataset.column = String(column);
      if (black) {
        const bits = [];
        if (across !== NO_TOTAL) {
          bits.push(Object.assign(document.createElement("span"), {
            className: "across-total",
            textContent: String(across),
          }));
        }
        if (down !== NO_TOTAL) {
          bits.push(Object.assign(document.createElement("span"), {
            className: "down-total",
            textContent: String(down),
          }));
        }
        td.replaceChildren(...bits);
        // Not focusable and not a button. There is no move that changes a black
        // square, so putting it in the tab order would be giving somebody playing by
        // keyboard a stop that does nothing.
        td.setAttribute("aria-label", kakuroName(column, row, BLACK, across, down));
      } else {
        td.tabIndex = 0;
        // `textbox`, not `button`. A white square takes a value rather than being
        // switched, and announcing it as a button would tell somebody using a screen
        // reader to press Enter when what they need to do is type a digit.
        td.setAttribute("role", "textbox");
        td.setAttribute("aria-readonly", "false");
        td.setAttribute("aria-label", kakuroName(column, row, 0, NO_TOTAL, NO_TOTAL));
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}

/** Copy the core's digits onto the Kakuro grid. */
function refreshKakuro() {
  const width = game.width();
  const digits = Array.from(game.digits());
  for (const td of el("kboard").querySelectorAll("td.kcell.white")) {
    const row = Number(td.dataset.row);
    const column = Number(td.dataset.column);
    const digit = digits[row * width + column];
    td.textContent = digit > 0 ? String(digit) : "";
    // Reset here rather than where it was typed, because the core can change a square
    // the player did not touch: undo, redo, a hint, or loading a saved game.
    td.setAttribute("aria-label", kakuroName(column, row, digit, NO_TOTAL, NO_TOTAL));
  }
}

/** Write a digit, or empty the square when `digit` is 0.
 *
 *  Zero goes straight to the core, which turns it into an empty square. The page does
 *  not decide that nought is not a Kakuro digit — `write_and_say` does, beside the rule
 *  it comes from. */
function typeDigit(td, digit) {
  clearHintRing();
  clearCheckMarks();
  el("note").textContent = game.write_and_say(
    Number(td.dataset.column),
    Number(td.dataset.row),
    digit
  );
  refresh();
}

/** Move the keyboard to the next white square in a direction, skipping black ones.
 *
 *  Skipping rather than stopping: a black square is part of the board's shape and
 *  there is nothing to do to it, so landing on one would be a dead stop in the middle
 *  of a row. Running off the edge stays where it is rather than wrapping, because
 *  wrapping to the far side of the board is disorienting when you cannot see it. */
function stepTo(td, byColumn, byRow) {
  const width = game.width();
  const height = game.height();
  let column = Number(td.dataset.column);
  let row = Number(td.dataset.row);
  for (let guard = 0; guard < width * height; guard += 1) {
    column += byColumn;
    row += byRow;
    if (column < 0 || row < 0 || column >= width || row >= height) return;
    const next = el("kboard").querySelector(
      `td.kcell.white[data-row="${row}"][data-column="${column}"]`
    );
    if (next) {
      next.focus();
      return;
    }
  }
}

const SVG = "http://www.w3.org/2000/svg";

function svg(name, attributes) {
  const node = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) {
    node.setAttribute(key, String(value));
  }
  return node;
}

/** Where a dot is drawn. */
const at = (column, row) => [MARGIN + column * STEP, MARGIN + row * STEP];

/** Build the loop board once. Taps change lines in place after this.
 *
 *  Every line comes from `game.line_places()`, in that order, so this page never works
 *  out the numbering for itself. The marks arrive later from `game.lines()` at the same
 *  positions. */
function drawLoopBoard() {
  const across = game.dots_across();
  const down = game.dots_down();
  const board = el("loop");
  board.replaceChildren();
  board.setAttribute("width", MARGIN * 2 + (across - 1) * STEP);
  board.setAttribute("height", MARGIN * 2 + (down - 1) * STEP);
  board.setAttribute("viewBox", `0 0 ${MARGIN * 2 + (across - 1) * STEP} ${MARGIN * 2 + (down - 1) * STEP}`);
  board.setAttribute("aria-label", `a loop puzzle, ${across - 1} squares across and ${down - 1} down`);

  // The numbers in the squares, which a player never changes.
  for (let row = 0; row < down - 1; row += 1) {
    for (let column = 0; column < across - 1; column += 1) {
      const number = game.number(column, row);
      if (number < 0) continue;
      const [x, y] = at(column + 0.5, row + 0.5);
      const text = svg("text", { class: "number", x, y });
      text.textContent = String(number);
      text.dataset.column = String(column);
      text.dataset.row = String(row);
      board.appendChild(text);
    }
  }

  const places = Array.from(game.line_places());
  for (let i = 0; i < places.length; i += 3) {
    const side = places[i];
    const column = places[i + 1];
    const row = places[i + 2];
    const [x1, y1] = at(column, row);
    const [x2, y2] = side === Side.Across ? at(column + 1, row) : at(column, row + 1);
    const [mx, my] = [(x1 + x2) / 2, (y1 + y2) / 2];

    const edge = svg("g", { class: "edge", "data-drawn": Drawn.Unknown, tabindex: 0, role: "button" });
    edge.dataset.side = String(side);
    edge.dataset.column = String(column);
    edge.dataset.row = String(row);
    edge.setAttribute("aria-label", lineName(side, column, row, Drawn.Unknown));
    edge.appendChild(svg("line", { class: "grab", x1, y1, x2, y2 }));
    edge.appendChild(svg("line", { class: "line", x1, y1, x2, y2 }));
    edge.appendChild(svg("line", { class: "ruled", x1: mx - 4, y1: my - 4, x2: mx + 4, y2: my + 4 }));
    edge.appendChild(svg("line", { class: "ruled", x1: mx - 4, y1: my + 4, x2: mx + 4, y2: my - 4 }));
    // Where a hint points. Drawn for every line and shown for at most one, because
    // adding a node to the picture while somebody is looking at it moves the rest about.
    edge.appendChild(svg("circle", { class: "pointer", cx: mx, cy: my, r: 8 }));
    board.appendChild(edge);
  }

  // The dots last, so they sit on top of the lines.
  for (let row = 0; row < down; row += 1) {
    for (let column = 0; column < across; column += 1) {
      const [cx, cy] = at(column, row);
      board.appendChild(svg("circle", { class: "dot", cx, cy, r: 2.5 }));
    }
  }
}

/** Copy the core's lines onto the page. One call for the whole board. */
function refreshLoop() {
  const marks = game.lines();
  const edges = el("loop").querySelectorAll("g.edge");
  edges.forEach((edge, i) => {
    edge.dataset.drawn = String(marks[i]);
    edge.setAttribute(
      "aria-label",
      lineName(Number(edge.dataset.side), Number(edge.dataset.column), Number(edge.dataset.row), marks[i])
    );
  });

  // Which numbers are still unmet, so the met ones can fade. Taken from the rules,
  // never counted here.
  const unmet = new Set();
  const pairs = Array.from(game.numbers_not_met());
  for (let i = 0; i < pairs.length; i += 2) unmet.add(`${pairs[i]},${pairs[i + 1]}`);
  for (const text of el("loop").querySelectorAll("text.number")) {
    const key = `${text.dataset.column},${text.dataset.row}`;
    text.dataset.met = unmet.has(key) ? "no" : "yes";
  }

  // What the lines add up to so far, in the core's own sentence.
  el("shape").textContent = game.shape();
}

function tapLine(edge) {
  clearHintRing();
  clearCheckMarks();
  const side = Number(edge.dataset.side) === Side.Across ? Side.Across : Side.Down;
  const column = Number(edge.dataset.column);
  const row = Number(edge.dataset.row);
  const now = Number(edge.dataset.drawn);
  el("note").textContent = game.draw_and_say(side, column, row, NEXT_LINE[now]);
  refresh();
}

/** Stop pointing at whatever the last hint pointed at.
 *
 *  The sentence stays on the screen; only the ring goes. Somebody who has just marked
 *  the square a hint named should not still see it ringed, but they may well want to
 *  read the reason again. */
function clearHintRing() {
  for (const marked of document.querySelectorAll('[data-hint="yes"]')) {
    delete marked.dataset.hint;
  }
}

/** Stop marking whatever the last check marked.
 *
 *  Called wherever the hint ring is cleared, and for the same reason: once the board
 *  has moved on, a mark left over points at a line that may now be fine. The sentence
 *  stays until the next check, because a player wants to read it twice. */
function clearCheckMarks() {
  for (const marked of document.querySelectorAll('[data-wrong="yes"]')) {
    delete marked.dataset.wrong;
  }
}

/** Ask the core how the board is doing, and mark what it names.
 *
 *  **Nothing is worked out here, and nothing is worked out there either.** A check
 *  counts the player's own marks against the clues printed on the board: a line that
 *  cannot match its numbers, a square with too many sides drawn, a run already past its
 *  total. No answer is read, because none is published, and no solver runs.
 *
 *  That is why it is free and unlimited while hints are three to a puzzle. A hint tells
 *  a player something new; a check only tells them what is already in front of them. */
function askForACheck() {
  clearCheckMarks();
  const found = game.check();
  const said = el("check-said");
  said.hidden = false;
  said.textContent = found.says();
  said.classList.toggle("wrong", !found.clear());

  // Three numbers per place, in the order the core reports them, exactly as a hint's
  // places are read. The page does not work out which game it is holding.
  const places = Array.from(found.places());
  for (let i = 0; i < places.length; i += 3) {
    const marked = placeOnTheBoard(places[i], places[i + 1], places[i + 2]);
    if (marked) marked.dataset.wrong = "yes";
  }
}

/** The thing on screen at one of the core's places, whichever game is showing. */
function placeOnTheBoard(kind, row, column) {
  if (kind === SQUARE) {
    return el("board").querySelector(`td[data-row="${row}"][data-column="${column}"]`);
  }
  if (kind === DIGIT) {
    return el("kboard").querySelector(
      `td.kcell.white[data-row="${row}"][data-column="${column}"]`
    );
  }
  return el("loop").querySelector(
    `g.edge[data-side="${kind}"][data-column="${column}"][data-row="${row}"]`
  );
}

/** How many hints are left, in the core's count rather than one kept here. */
function refreshHintsLeft() {
  const left = game ? game.hints_left() : 0;
  el("hints-left").textContent =
    left === 0 ? "No hints left" : left === 1 ? "1 hint left" : `${left} hints left`;
  el("hint").disabled = left === 0;
}

/** Ask the core for a hint. It works the next part out and marks it in.
 *
 *  Everything that matters happens inside `game.hint()`: what the clues decide, how
 *  much of it this hint is worth, whether there is any allowance left, and the marking
 *  itself, which goes through the ordinary rules. This function shows the sentence and
 *  rings what just changed.
 *
 *  The marks are ordinary moves, so Undo takes them back the same way it takes back a
 *  tap — one at a time, which is why a hint that filled a whole row shows up in the
 *  move count as a whole row. */
function askForAHint() {
  clearHintRing();
  clearCheckMarks();
  const said = el("hint-said");
  let hint;
  try {
    hint = game.hint();
  } catch (problem) {
    // All three spent, or nothing left to work out. The core's own sentence.
    said.hidden = false;
    said.textContent = problem.message;
    refreshHintsLeft();
    return;
  }

  said.hidden = false;
  said.textContent = hint.says();

  // The board first, because the hint has already marked it.
  refresh();

  // Then ring everything it filled in, so a player can see what just changed. Three
  // numbers per place, in the order the core reports them: what kind of place, its
  // row, its column. The page does not work out which game it is holding.
  const places = Array.from(hint.places());
  let first = null;
  for (let i = 0; i < places.length; i += 3) {
    const marked = placeOnTheBoard(places[i], places[i + 1], places[i + 2]);
    if (!marked) continue;
    marked.dataset.hint = "yes";
    if (!first) first = marked;
  }
  // The keyboard goes to the first thing that changed, so somebody playing without a
  // mouse is left where the board just moved rather than back on the button.
  if (first) first.focus();

  refreshHintsLeft();
}

/** Copy the core's board onto the page. One call for the whole board, either game. */
function refresh() {
  if (game.family() === "slitherlink") {
    refreshLoop();
  } else if (game.family() === "kakuro") {
    refreshKakuro();
  } else {
    const board = game.board();
    const width = game.width();
    for (const td of el("board").querySelectorAll("td.square")) {
      const row = Number(td.dataset.row);
      const column = Number(td.dataset.column);
      const mark = board[row * width + column];
      td.dataset.mark = String(mark);
      // The name is reset here rather than in `tap`, because the core can change a
      // square the player did not touch (undo, redo, loading a saved game). A name
      // updated only where it was tapped would drift from the board it describes.
      td.setAttribute("aria-label", squareName(row, column, mark));
    }
  }

  // The one useful thing each game can say about a part-finished board. Both come
  // from the core: `shape` for the loop game, `how_it_is_going` for this one.
  if (game.family() === "kakuro") {
    el("shape").textContent = game.how_it_is_going();
    // The squares of any run holding a digit twice. The core names the squares; the
    // page only paints them. Two numbers each, a column then a row.
    const repeats = new Set();
    const flagged = Array.from(game.squares_with_a_repeat());
    for (let i = 0; i < flagged.length; i += 2) {
      repeats.add(`${flagged[i]},${flagged[i + 1]}`);
    }
    for (const td of el("kboard").querySelectorAll("td.kcell.white")) {
      td.classList.toggle("repeat", repeats.has(`${td.dataset.column},${td.dataset.row}`));
    }
  }

  refreshHintsLeft();

  const moves = game.moves_made();
  el("moves").textContent =
    moves === 0 ? "No moves yet" : moves === 1 ? "1 move" : `${moves} moves`;

  // Asked of the core, every single time.
  const solved = game.is_solved();
  el("solved").hidden = !solved;
  el("solved").textContent =
    game.family() === "slitherlink"
      ? "Solved. One loop, and every number met."
      : game.family() === "kakuro"
        ? "Solved. Every run adds up, with no digit twice."
        : "Solved. Every clue matches.";

  // "Delivered is not played." A saved puzzle stops being held only once it is
  // actually finished, which is the whole reason downloading five leaves five.
  if (solved && showing && showing.saved && !showing.counted) {
    showing.counted = true;
    try {
      page.mark_played(showing.fingerprint);
    } catch (problem) {
      el("note").textContent = problem.message;
    }
    refreshSaved();
  }
}

function tap(td) {
  clearHintRing();
  clearCheckMarks();
  const row = Number(td.dataset.row);
  const column = Number(td.dataset.column);
  const now = Number(td.dataset.mark);
  const said = game.mark_and_say(row, column, NEXT[now]);
  el("note").textContent = said;
  refresh();
}

/** Show what is saved on this device, in the core's own words. */
function refreshSaved() {
  try {
    el("saved-line").textContent = page.saved().in_words();
  } catch (problem) {
    // A browser in a private window refuses storage outright. That is worth saying
    // rather than leaving a line that never updates.
    el("saved-line").textContent = `Saving is not available here: ${problem.message}`;
  }
}

/** Hand the bytes to the core. Everything after this is drawing. */
/** Draw a puzzle the core has already accepted. Takes it on trust because
 *  `page.open_for_play` and `page.next_saved` are the only ways to get one, and both
 *  check it. */
function showPuzzle(puzzle) {
  el("signed-by").textContent = puzzle.signed_by();
  el("level").textContent = puzzle.band() || "none given";
  el("fingerprint").textContent = puzzle.fingerprint();
  el("encoding").textContent = `one answer only, under ${puzzle.encoding()}`;

  game = puzzle.play();
  const family = game.family();
  const loop = family === "slitherlink";
  const kakuro = family === "kakuro";
  el("board").hidden = loop || kakuro;
  el("kboard").hidden = !kakuro;
  // `toggleAttribute`, not `.hidden`. An SVG element is not an HTMLElement, so it has
  // no `hidden` property: assigning one sets a JavaScript field that nothing reads and
  // leaves the attribute exactly as it was. The board stayed invisible and every check
  // that asked `.hidden` agreed with it, which is how this went unnoticed.
  el("loop").toggleAttribute("hidden", !loop);
  // Both games have something to say about a part-finished board, in the same line.
  el("shape").hidden = !(loop || kakuro);
  // The other games' boards go away, not just out of sight. A hidden board left in the
  // page is a board that can be found by anything looking for one — which is exactly
  // how an invisible Slitherlink board got past every automated check once already.
  if (loop) {
    el("board").replaceChildren();
    el("kboard").replaceChildren();
    drawLoopBoard();
  } else if (kakuro) {
    el("board").replaceChildren();
    el("loop").replaceChildren();
    drawKakuroBoard();
  } else {
    el("loop").replaceChildren();
    el("kboard").replaceChildren();
    drawBoard();
  }
  // A new puzzle, so a new three hints, and neither the hint nor the check left over
  // from the last one: both describe a board that is no longer on the screen.
  el("hint-said").hidden = true;
  el("hint-said").textContent = "";
  el("check-said").hidden = true;
  el("check-said").textContent = "";
  clearHintRing();
  clearCheckMarks();
  // The bar at the bottom follows the puzzle that is actually open, not the other way
  // round: a puzzle opened by name from the address bar sets it too.
  currentFamily = family;
  markCurrentGame();
  el("game-name").textContent = NAMES[family] ?? family;
  refresh();
  showRules(game.family());
  el("note").textContent = HOW_TO[game.family()] ?? "";
  el("game").hidden = false;
}

function openBytes(bytes) {
  el("refused").hidden = true;

  let puzzle;
  try {
    // `open_for_play`, not `open`. The second one checks the package; this one also
    // asks whether the puzzle has been withdrawn. The page does not combine the two
    // answers itself, because the page works nothing out.
    puzzle = page.open_for_play(bytes);
  } catch (problem) {
    showRefusal(problem.message);
    return;
  }
  showing = { fingerprint: puzzle.fingerprint(), bytes, saved: false };
  showPuzzle(puzzle);
}

async function open(name) {
  el("refused").hidden = true;
  if (pretendOffline) {
    showRefusal(
      "There is no signal, so a new puzzle cannot be fetched. Play a saved one instead."
    );
    return;
  }
  let bytes;
  try {
    // A plain file, fetched by name. A puzzle's name is its own fingerprint, which is
    // why no index is needed to find it.
    const response = await fetch(`store/${name}/package.gspk`);
    if (!response.ok) throw new Error(`the server said ${response.status}`);
    bytes = new Uint8Array(await response.arrayBuffer());
  } catch (problem) {
    showRefusal(`Could not fetch that puzzle: ${problem.message}`);
    return;
  }
  openBytes(bytes);
}

/** Stop a puzzle somebody is part-way through, because it has been withdrawn.
 *
 *  The project owner's decision, in as many words: stop it right away. The board closes
 *  with a short note, and whatever was filled in is lost. The alternative — letting
 *  somebody finish a puzzle that has no answer — is worse, and letting them finish one
 *  with two answers means marking them wrong when they were right. */
function closeTheBoard(why) {
  game = null;
  showing = null;
  el("game").hidden = true;
  el("solved").hidden = true;
  showRefusal(why);
}

/** Fetch the signed list of withdrawn puzzles and act on it.
 *
 *  Everything that matters here happens inside `accept_withdrawals`: the signature, the
 *  list's number, and deleting what it names. This function fetches bytes and shows a
 *  sentence. */
async function checkWithdrawn() {
  if (pretendOffline) {
    el("note").textContent =
      "There is no signal, so the list of withdrawn puzzles cannot be fetched.";
    return;
  }
  let bytes;
  try {
    const response = await fetch("store/withdrawals.gspk");
    if (response.status === 404) {
      el("note").textContent = "Nothing has been withdrawn.";
      return;
    }
    if (!response.ok) throw new Error(`the server said ${response.status}`);
    bytes = new Uint8Array(await response.arrayBuffer());
  } catch (problem) {
    el("note").textContent = `Could not fetch the list: ${problem.message}`;
    return;
  }

  try {
    el("note").textContent = page.accept_withdrawals(bytes).in_words();
  } catch (problem) {
    // Includes the case where this device already has a newer list, which is a refusal
    // and not a fault.
    el("note").textContent = problem.message;
  }
  refreshSaved();

  // And the puzzle on the screen, which the list may have just named.
  if (showing) {
    try {
      const why = page.why_withdrawn(showing.fingerprint);
      if (why) closeTheBoard(why);
    } catch (problem) {
      el("note").textContent = problem.message;
    }
  }
}

/** Today, as this device's clock has it.
 *
 *  The clock's entire job. It picks which day to look up in a file that was signed
 *  before it was read, so a wrong clock shows the wrong day's puzzle and can do nothing
 *  else: it cannot make a bad puzzle look good, revive a withdrawn one, or invent a day
 *  nobody signed. */
function today() {
  const now = new Date();
  return [now.getFullYear(), now.getMonth() + 1, now.getDate()];
}

/** Fetch the signed schedule and hand it to the core.
 *
 *  Everything that matters happens inside `accept_schedule`: the signature, and whether
 *  it is newer than the one this device already has. A device that already has one keeps
 *  working with no signal, which is why a failure here is a sentence and not a dead
 *  page. */
async function fetchSchedule() {
  if (pretendOffline) return;
  let bytes;
  try {
    const response = await fetch("store/schedule.gspk");
    if (!response.ok) throw new Error(`the server said ${response.status}`);
    bytes = new Uint8Array(await response.arrayBuffer());
  } catch (problem) {
    el("today-line").textContent = `Could not fetch the schedule: ${problem.message}`;
    return;
  }
  try {
    page.accept_schedule(bytes);
  } catch (problem) {
    // Includes the case where this device already has a newer one, which is a refusal
    // and not a fault.
    el("today-line").textContent = problem.message;
  }
}

/** Fill the bar of games at the bottom from the schedule.
 *
 *  A bar of buttons rather than a drop-down menu: on a phone the games are the thing
 *  switched most often and a menu costs two taps, the first of which is out of reach of
 *  a thumb at the top of the screen. Which game is showing is said with
 *  `aria-current`, so it is not carried by colour alone. */
function refreshGames() {
  const games = page.scheduled_games();
  el("game-bar").replaceChildren(
    ...games.map((family) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "game-tab";
      button.dataset.pick = family;
      button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${GAME_ICONS[family] ?? ""}</svg>`;
      button.append(NAMES[family] ?? family);
      button.addEventListener("click", () => chooseGame(family));
      return button;
    })
  );
  markCurrentGame();
  return games;
}

/** Say which game is showing, on the bar. */
function markCurrentGame() {
  for (const button of el("game-bar").querySelectorAll(".game-tab")) {
    if (button.dataset.pick === currentFamily) {
      button.setAttribute("aria-current", "page");
    } else {
      button.removeAttribute("aria-current");
    }
  }
}

/** Switch to a game and open its puzzle for today. */
function chooseGame(family) {
  currentFamily = family;
  markCurrentGame();
  const days = refreshDays(family);
  if (days.length > 0) void open(days[0].name());
}

/** Fill the day picker with today and the days before it, and say what today holds.
 *
 *  The archive comes from the core, which refuses to list a day that has not arrived.
 *  A page that filtered the list itself would be a second answer to "has this day
 *  happened", and one of the two would be wrong. */
function refreshDays(family) {
  const [year, month, day] = today();
  const days = page.archive(year, month, day, family);
  el("day-pick").replaceChildren(
    ...days.map((entry, index) =>
      Object.assign(document.createElement("option"), {
        value: entry.name(),
        textContent: index === 0 ? `${entry.date()} (today)` : entry.date(),
      })
    )
  );
  const line = el("today-line");
  if (days.length === 0) {
    // Said where it can be seen. The date line sits under the game's name, inside the
    // board, and there is no board when there is no puzzle for today.
    const why = page.has_schedule()
      ? "The schedule has no puzzle for today for this game yet."
      : "This device has no schedule yet, so there is no puzzle for today. Connect to the internet to get one.";
    line.textContent = why;
    showRefusal(why);
  } else {
    line.textContent = `Today is ${days[0].date()}. ${days.length - 1} earlier ${
      days.length === 2 ? "day is" : "days are"
    } in the archive.`;
  }
  sayWhichDay();
  return days;
}

/** The short date in the top line, taken from the day picker rather than worked out
 *  again here. Two places showing a date that could disagree is one too many. */
function sayWhichDay() {
  const picker = el("day-pick");
  const chosen = picker.options[picker.selectedIndex];
  el("day-short").textContent = chosen ? chosen.textContent.replace(" (today)", "") : "";
}

/** Download the next few days and keep them on the device.
 *
 *  The one place a day that has not arrived is deliberately fetched, because downloading
 *  ahead is the whole point of holding puzzles on a device. They are saved, not shown:
 *  the day picker still refuses to list them until their day comes. */
async function saveAhead(family) {
  if (pretendOffline) {
    el("note").textContent = "There is no signal, so nothing can be downloaded ahead.";
    return;
  }
  const [year, month, day] = today();
  const coming = page.to_download(year, month, day, family, 5);
  if (coming.length === 0) {
    el("note").textContent = "The schedule has no further days to download yet.";
    return;
  }
  let saved = 0;
  for (const entry of coming) {
    try {
      const response = await fetch(`store/${entry.name()}/package.gspk`);
      if (!response.ok) throw new Error(`the server said ${response.status}`);
      const bytes = new Uint8Array(await response.arrayBuffer());
      page.save_for_later(bytes);
      saved += 1;
    } catch (problem) {
      // Said rather than swallowed, and the ones already saved stay saved. Running out
      // of room is a different fact from a day that cannot be fetched.
      el("note").textContent = `Stopped after ${saved}: ${problem.message}`;
      refreshSaved();
      return;
    }
  }
  el("note").textContent =
    saved === 1
      ? "Saved the next day. It will still be here with no signal."
      : `Saved the next ${saved} days. They will still be here with no signal.`;
  refreshSaved();
}

async function main() {
  await init();

  // The page's own key. Not the puzzle's, and not something fetched alongside it.
  page = new Page();
  try {
    page.trust(TRUSTED_KEY_ID, unhex(TRUSTED_PUBLIC_KEY));
  } catch (problem) {
    showRefusal(`This page's key is not usable: ${problem.message}`);
    return;
  }

  el("day-pick").addEventListener("change", () => {
    sayWhichDay();
    void open(el("day-pick").value);
  });

  el("open-menu").addEventListener("click", () => showMenu(true));
  el("close-menu").addEventListener("click", () => showMenu(false));
  el("veil").addEventListener("click", () => showMenu(false));
  // Escape closes it, which is what a dialog is expected to do and the only way out
  // for somebody on a keyboard who opened it by mistake.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !el("menu").hidden) showMenu(false);
  });

  el("board").addEventListener("click", (event) => {
    const td = event.target.closest("td.square");
    if (td) tap(td);
  });
  el("board").addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const td = event.target.closest("td.square");
    if (!td) return;
    event.preventDefault();
    tap(td);
  });
  // Tapping a white square puts the keyboard on it. Nothing is written by a tap: a
  // Kakuro square takes a value, and there is no value in a tap. On a phone, focusing
  // the square is what brings the on-screen keyboard up.
  el("kboard").addEventListener("click", (event) => {
    const td = event.target.closest("td.kcell.white");
    if (td) td.focus();
  });
  el("kboard").addEventListener("keydown", (event) => {
    const td = event.target.closest("td.kcell.white");
    if (!td) return;
    const key = event.key;
    if (key >= "1" && key <= "9") {
      event.preventDefault();
      typeDigit(td, Number(key));
      return;
    }
    // Backspace, Delete and a typed nought all mean the same thing. Nought is in here
    // because somebody will type it, and the honest answer is to empty the square
    // rather than to refuse a keystroke with no explanation.
    if (key === "Backspace" || key === "Delete" || key === "0") {
      event.preventDefault();
      typeDigit(td, 0);
      return;
    }
    const steps = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    if (steps[key]) {
      event.preventDefault();
      stepTo(td, steps[key][0], steps[key][1]);
    }
  });
  el("loop").addEventListener("click", (event) => {
    const edge = event.target.closest("g.edge");
    if (edge) tapLine(edge);
  });
  el("loop").addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const edge = event.target.closest("g.edge");
    if (!edge) return;
    event.preventDefault();
    tapLine(edge);
  });
  // Remembering the fold is a convenience and nothing more, so a browser that refuses
  // to store it just means the rules open again next time.
  el("rules").addEventListener("toggle", () => {
    try {
      window.localStorage.setItem(RULES_CLOSED, el("rules").open ? "no" : "yes");
    } catch {
      /* nothing to do: the fold still works for this visit. */
    }
  });
  el("hint").addEventListener("click", askForAHint);
  el("check").addEventListener("click", askForACheck);
  // Undo and redo take the ring off as well. A hint fills squares in, so once those
  // marks are taken back the ring points at squares that are blank again, which would
  // be pointing at nothing.
  el("undo").addEventListener("click", () => {
    clearHintRing();
    clearCheckMarks();
    el("note").textContent = game.undo() ? "" : "There is nothing left to undo.";
    refresh();
  });
  el("redo").addEventListener("click", () => {
    clearHintRing();
    clearCheckMarks();
    el("note").textContent = game.redo() ? "" : "There is nothing to redo.";
    refresh();
  });

  el("save").addEventListener("click", () => {
    if (!showing) return;
    try {
      page.save_for_later(showing.bytes);
      el("note").textContent = "Saved. It will still be here with no signal.";
    } catch (problem) {
      el("note").textContent = problem.message;
    }
    refreshSaved();
  });

  el("play-saved").addEventListener("click", () => {
    el("refused").hidden = true;
    let puzzle;
    try {
      // Checked on the way out of storage, exactly as one off the network is.
      puzzle = page.next_saved();
    } catch (problem) {
      showRefusal(problem.message);
      return;
    }
    // Being handed a puzzle is not having played it. The buffer still holds this one
    // until the puzzle is actually solved, below.
    showing = { fingerprint: puzzle.fingerprint(), bytes: null, saved: true };
    showPuzzle(puzzle);
    refreshSaved();
  });

  el("check-withdrawn").addEventListener("click", () => {
    void checkWithdrawn();
  });

  el("offline").addEventListener("click", () => {
    pretendOffline = !pretendOffline;
    el("offline").setAttribute("aria-pressed", String(pretendOffline));
    el("offline").textContent = pretendOffline
      ? "Signal is back on"
      : "Pretend there is no signal";
    el("note").textContent = pretendOffline
      ? "Nothing will be fetched. Only saved puzzles will open."
      : "";
  });

  refreshSaved();

  el("save-ahead").addEventListener("click", () => {
    void saveAhead(currentFamily);
  });

  refreshSaved();

  // The schedule first: without it the page has nothing to ask for.
  await fetchSchedule();
  const games = refreshGames();

  // A name in the address still works, because a puzzle's name is its own fingerprint
  // and so a link to one needs no index to resolve it. It is how a withdrawn puzzle or
  // an old day gets looked at directly.
  const wanted = new URLSearchParams(location.search).get("puzzle");
  if (wanted) {
    if (games.length > 0) {
      currentFamily = games[0];
      markCurrentGame();
      refreshDays(currentFamily);
    }
    await open(wanted);
    return;
  }

  if (games.length === 0) {
    showRefusal(
      "This device has no schedule, so there is no puzzle to play. Connect to the " +
        "internet, or run scripts/demo-web.sh if this is your own copy."
    );
    return;
  }

  currentFamily = games[0];
  markCurrentGame();
  const days = refreshDays(currentFamily);
  if (days.length === 0) return;
  await open(days[0].name());
}

// Exposed so a test can drive the page the way a person does, and so a mistake in here
// is visible in a browser console rather than silent.
window.gatedspark = {
  open,
  openBytes,
  tap: (row, column) =>
    tap(el("board").querySelector(`td[data-row="${row}"][data-column="${column}"]`)),
  isSolved: () => game.is_solved(),
  movesMade: () => game.moves_made(),
  undo: () => el("undo").click(),
  redo: () => el("redo").click(),
  savedLine: () => el("saved-line").textContent,
  save: () => el("save").click(),
  playSaved: () => el("play-saved").click(),
  toggleOffline: () => el("offline").click(),
  todayLine: () => el("today-line").textContent,
  games: () => Array.from(el("game-bar").querySelectorAll(".game-tab")).map((b) => b.dataset.pick),
  gameShowing: () =>
    el("game-bar").querySelector('.game-tab[aria-current="page"]')?.dataset.pick ?? null,
  days: () => Array.from(el("day-pick").options).map((o) => o.textContent),
  chooseGame: (family) => {
    el("game-bar").querySelector(`.game-tab[data-pick="${family}"]`).click();
  },
  chooseDay: (index) => {
    el("day-pick").selectedIndex = index;
    el("day-pick").dispatchEvent(new Event("change"));
  },
  saveAhead: () => saveAhead(currentFamily),
  scheduleSeen: () => page.schedule_seen(),
  toDownload: (y, m, d, family, most) => page.to_download(y, m, d, family, most),
  checkWithdrawn,
  withdrawalsSeen: () => page.withdrawals_seen(),
  boardIsShowing: () => !el("game").hidden,
  rulesTitle: () => el("rules-title").textContent,
  rulesShown: () => Array.from(el("rules-list").children).map((li) => li.textContent),
  rulesOpen: () => el("rules").open,
  fingerprint: () => el("fingerprint").textContent,
  refusal: () =>
    el("refused").hidden ? null : el("refused").textContent,
  forgetEverythingSaved: () => {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith("gatedspark/")) localStorage.removeItem(key);
    }
  },
  boardAt: (row, column) =>
    Number(
      el("board").querySelector(`td[data-row="${row}"][data-column="${column}"]`).dataset.mark
    ),

  // The loop game. Same idea: a handle on what is actually on the screen, so a check
  // written against the page reads the page rather than asking the core twice.
  family: () => game.family(),
  tapLine: (side, column, row) =>
    tapLine(
      el("loop").querySelector(
        `g.edge[data-side="${side}"][data-column="${column}"][data-row="${row}"]`
      )
    ),
  lineAt: (side, column, row) =>
    Number(
      el("loop").querySelector(
        `g.edge[data-side="${side}"][data-column="${column}"][data-row="${row}"]`
      ).dataset.drawn
    ),
  linesDrawn: () =>
    el("loop").querySelectorAll('g.edge[data-drawn="0"]').length,
  linesOnTheBoard: () => el("loop").querySelectorAll("g.edge").length,
  numbersOnTheBoard: () => el("loop").querySelectorAll("text.number").length,
  numbersMet: () =>
    el("loop").querySelectorAll('text.number[data-met="yes"]').length,
  shapeSaid: () => el("shape").textContent,

  // The digit game. Same idea again: a handle on what is on the screen, so a check
  // reads the page rather than asking the core twice. Everything here looks at
  // `#kboard`, which is a different table from the picture game's on purpose.
  kakuroSquares: () => el("kboard").querySelectorAll("td.kcell").length,
  whiteSquares: () => el("kboard").querySelectorAll("td.kcell.white").length,
  blackSquares: () => el("kboard").querySelectorAll("td.kcell.black").length,
  totalsOnTheBoard: () =>
    el("kboard").querySelectorAll(".across-total, .down-total").length +
    Array.from(el("kboard").querySelectorAll("th.rim")).filter((th) => th.textContent !== "")
      .length,
  digitAt: (column, row) => {
    const td = el("kboard").querySelector(
      `td.kcell.white[data-row="${row}"][data-column="${column}"]`
    );
    return td ? td.textContent : null;
  },
  // What a key press does, driven through the page's own handler rather than by
  // calling the core: the keyboard is the thing being checked.
  focusSquare: (column, row) => {
    const td = el("kboard").querySelector(
      `td.kcell.white[data-row="${row}"][data-column="${column}"]`
    );
    if (!td) return null;
    td.focus();
    return document.activeElement === td;
  },
  focusedSquare: () => {
    const td = document.activeElement;
    if (!td || !td.dataset || td.dataset.column === undefined) return null;
    return [Number(td.dataset.column), Number(td.dataset.row)];
  },
  focusedSquareName: () => document.activeElement?.getAttribute("aria-label") ?? null,
  // Writing without a key press, for a check that has a whole board to lay in and no
  // reason to drive the keyboard a hundred times. It goes through the same `typeDigit`
  // the keyboard handler calls, so it is not a second way to write a digit.
  writeDigit: (column, row, digit) => {
    const td = el("kboard").querySelector(
      `td.kcell.white[data-row="${row}"][data-column="${column}"]`
    );
    if (!td) return false;
    typeDigit(td, digit);
    return true;
  },
  whiteSquaresInOrder: () =>
    Array.from(el("kboard").querySelectorAll("td.kcell.white")).map((td) => [
      Number(td.dataset.column),
      Number(td.dataset.row),
    ]),
  squareName: (column, row) =>
    el("kboard")
      .querySelector(`td.kcell[data-row="${row}"][data-column="${column}"]`)
      ?.getAttribute("aria-label") ?? null,
  squaresWithARepeat: () => el("kboard").querySelectorAll("td.kcell.white.repeat").length,
  kboardIsShowing: () => !el("kboard").hidden,
  kboardSize: () => el("kboard").getBoundingClientRect().width,
  hintedDigits: () =>
    Array.from(el("kboard").querySelectorAll('td.kcell.white[data-hint="yes"]')).map((td) => [
      Number(td.dataset.column),
      Number(td.dataset.row),
      td.textContent,
    ]),

  // The one menu. Read off the page, so a check sees what a player sees.
  menuIsOpen: () => !el("menu").hidden,
  openMenu: () => el("open-menu").click(),
  closeMenu: () => el("close-menu").click(),
  menuSaysItIsOpen: () => el("open-menu").getAttribute("aria-expanded"),

  // Checking your work. Free and unlimited, so there is no allowance to read.
  check: () => el("check").click(),
  checkSaid: () => (el("check-said").hidden ? null : el("check-said").textContent),
  checkIsAnnounced: () =>
    el("check-said").getAttribute("aria-live") === "polite" &&
    el("check-said").getAttribute("role") === "status",
  markedWrong: () => document.querySelectorAll('[data-wrong="yes"]').length,
  squaresMarkedWrong: () =>
    Array.from(el("board").querySelectorAll('td.square[data-wrong="yes"]')).map((td) => [
      Number(td.dataset.row),
      Number(td.dataset.column),
    ]),

  // Hints. Each one reads the page, so a check sees what a player sees rather than
  // asking the core the same question twice.
  hint: () => el("hint").click(),
  hintSaid: () => (el("hint-said").hidden ? null : el("hint-said").textContent),
  hintsLeftSaid: () => el("hints-left").textContent,
  hintOffered: () => !el("hint").disabled,
  hintIsAnnounced: () =>
    el("hint-said").getAttribute("aria-live") === "polite" &&
    el("hint-said").getAttribute("role") === "status",
  hintedSquare: () => {
    const td = el("board").querySelector('td.square[data-hint="yes"]');
    return td ? [Number(td.dataset.row), Number(td.dataset.column)] : null;
  },
  hintedSquares: () =>
    Array.from(el("board").querySelectorAll('td.square[data-hint="yes"]')).map((td) => [
      Number(td.dataset.row),
      Number(td.dataset.column),
      Number(td.dataset.mark),
    ]),
  hintedLine: () => {
    const edge = el("loop").querySelector('g.edge[data-hint="yes"]');
    return edge
      ? [Number(edge.dataset.side), Number(edge.dataset.column), Number(edge.dataset.row)]
      : null;
  },
  hintedLines: () =>
    Array.from(el("loop").querySelectorAll('g.edge[data-hint="yes"]')).map((edge) => [
      Number(edge.dataset.side),
      Number(edge.dataset.column),
      Number(edge.dataset.row),
      Number(edge.dataset.drawn),
    ]),
  focusIsOnTheHint: () =>
    document.activeElement instanceof Element &&
    document.activeElement.matches('[data-hint="yes"]'),
  // Where each line is, in the order the core reports them. For laying an answer in.
  linePlaces: () => Array.from(game.line_places()),
};

main().catch((problem) => showRefusal(`This page failed to start: ${problem.message}`));
</script>
</body>
</html>
